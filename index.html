<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearson Vocab</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>
</head>

<body data-light-mode="0">
    <center>
        <div id="words">
            <h2 id="currentWord">bonjour</h2>
            <h2 id="currentWordTranslation">hello</h2>
            <div class="buttons">
                <button onclick="randomiseWord()">Randomise word</button>
                <button onclick="toggleTranslation()">Toggle translation</button>
                <button id="englishToLanguage" class="languageNameReplace" onclick="toggleEnglishToLanguage()">Switch to English -> {LANGUAGE}</button>
            </div>
        </div>
        <div id="overlay"></div>
        <div class="aboveOverlay">
            <div id="languageSelection">
                <h1 class="aboveOverlay">Choose your language</h1>
                <div class="aboveOverlay buttons" id="languageSelectionButtons">
                    <button onclick="selectLanguage('french')">French</button>
                    <button onclick="selectLanguage('spanish')">Spanish</button>
                </div>
            </div>
        </div>
    </center>
    <div id="loading"
        style="left: 0px; top: 0px; position: absolute; width: 100%; height: 100%; background-color: oklch(14.5% 0 0); color: oklch(98.5% 0 0);">
        Loading... please wait
    </div>
    <script src="main.js" type="module"></script>
</body>

</html>
