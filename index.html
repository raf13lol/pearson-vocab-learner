<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Pearson MFL vocab">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Words">

    <title>Pearson Vocab</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>
</head>

<body>
    <div id="toolbarButtons">
        <img id="lightModeButton" src="./assets/from-dark-mode.png" width="64" onclick="toggleDarkMode()">
        <img id="languageButton" src="./assets/lang-dark-mode.png" width="64" onclick="switchState('languageSelect')">
    </div>
    <div id="sidebarButtons">
        <button id="wordsButton" onclick="switchState('words')">Words</button><br>

        <button id="testButton" onclick="switchState('test')">Test</button><br>
    </div>
    <center>
        <div id="words">
            <h1 id="currentWord">bonjour</h1>
            <h1 id="currentWordTranslation">hello</h1>
            <div class="buttons">
                <button onclick="randomiseWord()">Randomise word</button>
                <button onclick="toggleTranslation()">Toggle translation</button>
                <button id="englishToLanguage" class="languageNameReplace" onclick="toggleEnglishToLanguage()">Switch to
                    English -> {LANGUAGE}</button>
            </div>
        </div>
        <div id="test">
            <h1 id="testProgress"></h1>
            <h1 id="testQuestion"></h1>
            <div id="testButtons" class="buttons"></div><br>

            <div id="testOptionButtons" class="buttons">
                <button>New test</button>
                <button id="noDelayButton" onclick="toggleNoDelay()">Disable next-question delay</button>
            </div>
        </div>
        <div id="languageSelect">
            <h1>Choose your language</h1>
            <div class="buttons">
                <button onclick="selectLanguage('french')">French</button>
                <button onclick="selectLanguage('spanish')">Spanish</button>
                <button onclick="selectLanguage('german')">German</button>
            </div>
        </div>

        <footer>WORK-IN-PROGRESS; FEATURES MAY BE INCOMPLETE OR NON-FUNCTIONAL.</footer>
    </center>
    <div id="loading"
        style="left: 0px; top: 0px; position: absolute; width: 100%; height: 100%; background-color: oklch(14.5% 0 0); color: oklch(98.5% 0 0);">
        Loading... please wait
    </div>
    <script src="main.js" type="module"></script>
</body>

</html>
