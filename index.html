<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Pearson MFL vocab">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Words">

    <title>Pearson Vocab</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>
</head>

<body>
    <aside id="toolbarButtons">
        <img id="lightModeButton" src="./assets/sun-regular-full.svg" width="50" onclick="toggleDarkMode()"
            alt="Dark mode toggle" role="button">
        <img id="languageButton" src="./assets/language-dark-full.svg" width="50"
            onclick="switchState('languageSelect')" alt="Open language select" role="button">
    </aside>
    <nav id="sidebarButtons">
        <button id="wordsButton" onclick="switchState('words')">Words</button><br>

        <button id="testButton" onclick="switchToTestState()">Test</button><br>

        <button id="searchButton" onclick="switchState('search')">Search</button><br>
    </nav>
    <center>
        <div id="words">
            <h1 id="currentWord" class="title">bonjour</h1>
            <h1 id="currentWordTranslation">hello</h1>
            <div class="buttons">
                <button onclick="randomiseWord()">Randomise word</button>
                <button onclick="toggleTranslation()">Toggle translation</button>
                <button id="englishToLanguage" class="languageNameReplace" onclick="toggleEnglishToLanguage()">Switch to
                    English -> {LANGUAGE}</button>
            </div>
        </div>
        <div id="test">
            <h1 id="testProgress" class="title"></h1>
            <h1 id="testQuestion"></h1>
            <div id="testButtons" class="buttons"></div><br>

            <div id="testOptionButtons" class="buttons">
                <button onclick="switchState('newTest')">New test</button>
                <button id="noDelayButton" onclick="toggleNoDelay()">Disable next-question delay</button>
            </div>
        </div>
        <div id="newTest">
            <h1 class="title">Choose button count for test</h1>
            <button onclick="createNewTest(2)">2 buttons</button><br>
            <button onclick="createNewTest(4)">4 buttons</button><br>
            <button onclick="createNewTest(9)">9 buttons</button><br>
            <div class="languageNameReplace">
                <input id="englishToLanguageCheckbox" type="checkbox">
                <label for="englishToLanguageCheckbox">English->{LANGUAGE}</label>
            </div>
        </div>
        <div id="search">
            <h1 class="title">Search</h1>
            <div id="searchInput">
                <input id="searchBar" type="search" placeholder="Enter term to search for"
                    aria-label="Enter term to search for"><br>

                <input id="searchMeaning" type="radio" name="searchFilter">
                <label for="searchMeaning">Search by meaning</label>

                <input id="searchWord" type="radio" name="searchFilter">
                <label for="searchWord">Search by word</label>

                <input id="searchWordClass" type="radio" name="searchFilter">
                <label for="searchWordClass">Search by word class</label>
            </div>
            <p id="searchLoading">Loading...</p>
            <p id="searchNoQuery">No search query (search * to see all vocab)</p>
            <p id="searchNoResults">No results found</p>
            <div id="searchResults">
                <table>
                    <thead>
                        <tr></tr>
                        <tr>
                            <td>Meaning</td>
                            <td>Word</td>
                            <td>Word class</td>
                        </tr>
                    </thead>
                    <tbody id="searchResultTable">
                        
                    </tbody>
                </table>
            </div>
        </div>
        <div id="languageSelect">
            <h1 class="title">Choose your language</h1>
            <div class="buttons">
                <button onclick="selectLanguage('french')">French</button>
                <button onclick="selectLanguage('spanish')">Spanish</button>
                <button onclick="selectLanguage('german')">German</button>
            </div>
        </div>
        <br>
        <button id="backButton" onclick="switchState('previous')">Back</button>
    </center>
    <div id="loading"
        style="left: 0px; top: 0px; position: absolute; width: 100%; height: 100%; background-color: oklch(14.5% 0 0); color: oklch(98.5% 0 0);">
        Loading... please wait
    </div>
    <script src="main.js" type="module"></script>
</body>

</html>
